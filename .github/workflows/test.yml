name: Tests

on:
  push:
    branches: [main, refactor, ui-redesign]
  pull_request:
    branches: [main, refactor, ui-redesign]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint || true

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyE2ETests1234567890abcdefghijABCDE"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "demo-e2e.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-e2e"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "demo-e2e.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:000000000000000000000"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
